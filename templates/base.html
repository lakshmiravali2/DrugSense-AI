<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Field Drug Test Companion (Prototype)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="navbar">
    <span class="brand">🔬 Field Test Companion — SIH26231 Prototype</span>
    <div>
      {% if global_alerts_count and global_alerts_count > 0 %}
      <span class="nav-alert-badge">🔔 {{ global_alerts_count }} alert{{ 's' if global_alerts_count != 1 else '' }}</span>
      {% endif %}
      <a href="{{ url_for('home') }}">Dashboard</a>
      <a href="{{ url_for('new_test') }}">New Test</a>
      <a href="{{ url_for('history') }}">History</a>
    </div>
  </div>
  <div class="container">
    {% block content %}{% endblock %}
  </div>
</body>
</html>
